<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found - QuickBite</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .notfound-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .notfound-code {
      font-size: 120px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b35, #ff8c5a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }
    .notfound-emoji { font-size: 64px; margin-bottom: 24px; }
    .notfound-wrap h2 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    .notfound-wrap p  { color: var(--text-muted); font-size: 16px; margin-bottom: 32px; max-width: 400px; }
    .notfound-links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <noscript>
    <div style="background:#ff6b35;color:white;text-align:center;padding:12px;font-family:sans-serif;font-size:14px;">
      ⚠️ JavaScript is required for QuickBite to work. Please enable it in your browser.
    </div>
  </noscript>

  <div class="notfound-wrap">
    <div class="notfound-emoji">🍽️</div>
    <div class="notfound-code">404</div>
    <h2>Page Not Found!</h2>
    <p>Oops! Looks like this page got eaten. Let's get you back to some delicious food.</p>
    <div class="notfound-links">
      <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Go Home</a>
      <a href="menu.html" class="btn-secondary"><i class="fas fa-utensils"></i> View Menu</a>
    </div>
  </div>
</body>
</html>
